# AKS Store Demo - Full Dapr Integration with Custom Images
# This manifest uses Dapr-enabled custom images with pub/sub and state store
# Replace image registry prefix with your own (ACR, GHCR, etc.)

# MongoDB StatefulSet (backing store for Dapr state component)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: mongodb
          image: mcr.microsoft.com/mirror/docker/library/mongo:4.2
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 5m
              memory: 75Mi
            limits:
              cpu: 25m
              memory: 1024Mi
          livenessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.runCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  ports:
    - port: 27017
  selector:
    app: mongodb
  type: ClusterIP
---
# RabbitMQ StatefulSet (backing store for Dapr pub/sub component)
apiVersion: v1
data:
  rabbitmq_enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_amqp1_0].
kind: ConfigMap
metadata:
  name: rabbitmq-enabled-plugins
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: rabbitmq
          image: mcr.microsoft.com/azurelinux/base/rabbitmq-server:3.13
          ports:
            - containerPort: 5672
              name: rabbitmq-amqp
            - containerPort: 15672
              name: rabbitmq-http
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "username"
            - name: RABBITMQ_DEFAULT_PASS
              value: "password"
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: rabbitmq-enabled-plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
      volumes:
        - name: rabbitmq-enabled-plugins
          configMap:
            name: rabbitmq-enabled-plugins
            items:
              - key: rabbitmq_enabled_plugins
                path: enabled_plugins
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: rabbitmq-amqp
      port: 5672
      targetPort: 5672
    - name: rabbitmq-http
      port: 15672
      targetPort: 15672
  type: ClusterIP
---
# Dapr Pub/Sub Component - RabbitMQ
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pub-sub
  namespace: default
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: host
      value: "amqp://username:password@rabbitmq:5672"
    - name: durable
      value: "true"
    - name: deletedWhenUnused
      value: "false"
    - name: autoAck
      value: "false"
    - name: reconnectWait
      value: "0"
    - name: concurrency
      value: "parallel"
scopes:
  - order-service
  - makeline-service
---
# Dapr State Store Component - MongoDB
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-store
  namespace: default
spec:
  type: state.mongodb
  version: v1
  metadata:
    - name: host
      value: "mongodb:27017"
    - name: databaseName
      value: "orderdb"
    - name: collectionName
      value: "orders"
    - name: writeConcern
      value: "majority"
    - name: readConcern
      value: "majority"
scopes:
  - makeline-service
---
# Order Service - Dapr Publisher (CUSTOM IMAGE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "order-service"
        dapr.io/app-port: "3000"
        dapr.io/log-level: "info"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
        dapr.io/config: "tracing"
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: order-service
          # REPLACE WITH YOUR REGISTRY: myregistry.azurecr.io/aks-store-demo/order-service:dapr-latest
          image: daprdemo.azurecr.io/aks-store-demo/order-service:dapr-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            # Dapr pub/sub configuration
            - name: USE_DAPR_PUBSUB
              value: "true"
            - name: PUBSUB_NAME
              value: "order-pub-sub"
            - name: PUBSUB_TOPIC
              value: "orders"
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: FASTIFY_ADDRESS
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 1m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: dapr-http
      port: 3500
      targetPort: 3500
    - name: dapr-grpc
      port: 50001
      targetPort: 50001
  selector:
    app: order-service
---
# Makeline Service - Dapr Subscriber & State Store (CUSTOM IMAGE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: makeline-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: makeline-service
  template:
    metadata:
      labels:
        app: makeline-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "makeline-service"
        dapr.io/app-port: "3001"
        dapr.io/log-level: "info"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
        dapr.io/config: "tracing"
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
        - name: makeline-service
          # REPLACE WITH YOUR REGISTRY: myregistry.azurecr.io/aks-store-demo/makeline-service:dapr-latest
          image: daprdemo.azurecr.io/aks-store-demo/makeline-service:dapr-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            # Dapr pub/sub and state store configuration
            - name: USE_DAPR_PUBSUB
              value: "true"
            - name: USE_DAPR_STATE_STORE
              value: "true"
            - name: PUBSUB_NAME
              value: "order-pub-sub"
            - name: PUBSUB_TOPIC
              value: "orders"
            - name: STATE_STORE_NAME
              value: "order-store"
            - name: DAPR_HTTP_PORT
              value: "3500"
          resources:
            requests:
              cpu: 1m
              memory: 6Mi
            limits:
              cpu: 5m
              memory: 20Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: makeline-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 3001
    - name: dapr-http
      port: 3501
      targetPort: 3500
    - name: dapr-grpc
      port: 50002
      targetPort: 50001
  selector:
    app: makeline-service
---
