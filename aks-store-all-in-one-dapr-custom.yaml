          image: daprdemo.azurecr.io/aks-store-demo/virtual-customer:dapr-latest
          imagePullPolicy: Always
          env:
            # Use Dapr service invocation
            - name: ORDER_SERVICE_URL
              value: "http://localhost:3500/v1.0/invoke/order-service/method/"
