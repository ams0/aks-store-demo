# Virtual Customer - Uses Dapr service invocation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual-customer
  template:
    metadata:
      labels:
        app: virtual-customer
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "virtual-customer"
        dapr.io/log-level: "info"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
        dapr.io/config: "tracing"
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
