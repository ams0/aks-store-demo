# Azure-hosted Dapr Components
# These components replace the in-cluster MongoDB and RabbitMQ with Azure services
# while keeping the same Dapr API calls in the application code

# Pub/Sub Component - Azure Service Bus (replaces RabbitMQ)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pub-sub
  namespace: default
spec:
  type: pubsub.azure.servicebus
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: azure-servicebus-secret
        key: connectionstring
    # Alternative: Use Azure AD authentication
    # - name: namespaceName
    #   value: "your-servicebus-namespace.servicebus.windows.net"
    - name: timeoutInSec
      value: "60"
    - name: handlerTimeoutInSec
      value: "30"
    - name: disableEntityManagement
      value: "false"
    - name: maxDeliveryCount
      value: "3"
    - name: lockDurationInSec
      value: "300"
    - name: lockRenewalInSec
      value: "20"
    - name: maxActiveMessages
      value: "10000"
    - name: maxConcurrentHandlers
      value: "10"
scopes:
  - order-service
  - makeline-service
---
# State Store Component - Azure Cosmos DB (replaces MongoDB)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-store
  namespace: default
spec:
  type: state.azure.cosmosdb
  version: v1
  metadata:
    - name: url
      value: "https://your-cosmosdb-account.documents.azure.com:443/"
    - name: masterKey
      secretKeyRef:
        name: azure-cosmosdb-secret
        key: masterkey
    - name: database
      value: "orderdb"
    - name: collection
      value: "orders"
    # Alternative: Use Azure AD authentication (recommended for production)
    # - name: clientId
    #   value: "your-client-id"
    # - name: clientSecret
    #   secretKeyRef:
    #     name: azure-cosmosdb-secret
    #     key: clientsecret
    # - name: tenantId
    #   value: "your-tenant-id"
scopes:
  - makeline-service
